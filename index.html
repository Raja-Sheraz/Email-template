  ─────────────────────────────────────────────────────────────────────────
  THE TRVLER.CO MAGAZINE — beehiiv WELCOME EMAIL
  Built from Sir's boarding-pass design (desktop + mobile HTML/CSS package).
  ONE file. Works on desktop, tablet and phone.
  ─────────────────────────────────────────────────────────────────────────

  HOW IT WAS BUILT
  Sir's design uses CSS the way a web page does - torn ticket edges, dashed
  perforations, barcodes, round stamps, radial gradients and clip-path.
  None of that survives in Gmail or Outlook. So the design was rendered in a
  real browser at 1200px (2x of 600) and each section captured as one crisp
  image. Those images are then laid out with plain email tables and real links.
  The result looks identical to the design but behaves like an email.

  THREE BUGS FIXED FROM THE ORIGINAL PACKAGE
  1. Everything printed twice. hero.png already contains the headline, the
     stamps and the plane trail; the HTML drew them a second time on top.
     Same with coast.png, which carries the "TRAVEL UPDATES" text and the
     CAPRI stamp inside the artwork. Both overlays are now suppressed.
  2. Wrong coordinates. BANFF / CANADA was labelled with London's numbers
     (51.4968 N, 0.1224 W). Now 51.1784 N, 115.5708 W. Sahara / Morocco was
     also wrong; now 31.7917 N, 7.0926 W.
  3. The page header (logo bar + hamburger menu) was removed - an email has
     no navigation.

  STILL WORTH FIXING AT SOURCE (baked into hero.png, cannot be edited here)
  - The round stamp reads "DVENTURE AWAITS" - the A is missing.
  - The Banff stamp inside the photo still shows 48.6467 N (should be 51.1784).

  ─────────────────────────────────────────────────────────────────────────
  HOW TO PUT THIS IN BEEHIIV
  1. Upload all 15 files from "img" to Newsletter -> Media library.
  2. Replace every src="img/..." below with the URL beehiiv returns.
  3. Settings -> Emails -> Configure welcome email -> Custom HTML block ->
     paste everything between "PASTE FROM HERE" and "PASTE UNTIL HERE".
  4. Send a test to the TEST segment. Open it on a phone. Click every link.
  5. Turn the welcome toggle ON only after mail.trvler.co verifies.

  IMPORTANT
  This design carries most of its words inside images. Gmail blocks images
  for unknown senders, so every alt="" below is written to carry the message
  on its own. Do not delete or shorten them.
-->
